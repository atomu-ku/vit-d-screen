name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web_app/frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: |
            web_app/backend/requirements.txt
            web_app/backend/requirements-dev.txt
      - name: Install model verification dependencies
        run: python -m pip install -r web_app/backend/requirements-dev.txt
      - name: Verify original Python predictions
        working-directory: web_app/backend
        run: python -m pytest -q
      - name: Check exported model and browser parity
        run: |
          python scripts/export_browser_model.py --check
          python scripts/verify_browser_model.py
      - name: Install frontend dependencies
        working-directory: web_app/frontend
        run: npm ci
      - name: Test browser inference
        working-directory: web_app/frontend
        run: npm test
      - name: Build for the repository Pages path
        working-directory: web_app/frontend
        run: npm run build -- --base=/vit-d-screen/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web_app/frontend/dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
